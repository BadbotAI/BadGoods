addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(e.key==='Escape'){e.preventDefault();const pair=[['search-panel','search-toggle'],['module-menu','modules'],['export-menu','export-trigger'],['help-panel','help-toggle']].find(([id])=>!$('#'+id).hidden);if(pair){closePanels();$('#'+pair[1]).focus()}else clearSelection();return}if(typing)return;if(e.target.closest('.float')&&e.key.startsWith('Arrow'))return;if(e.key==='/'){e.preventDefault();openSearch();return}if(e.ctrlKey||e.metaKey||e.altKey)return;if(['+','=','-','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='0')fitAll();else if(e.key==='+'||e.key==='=')zoomAt(z*1.25);else if(e.key==='-')zoomAt(z/1.25);else{x+=e.key==='ArrowLeft'?100:e.key==='ArrowRight'?-100:0;y+=e.key==='ArrowUp'?100:e.key==='ArrowDown'?-100:0;schedule()}}});
$('#minimap').addEventListener('pointerdown',e=>{const c=e.currentTarget,r=c.getBoundingClientRect(),p=c._map;if(!p)return;if(animation)cancelAnimationFrame(animation);animation=0;x=vw/2-((e.clientX-r.left-p.ox)/p.k)*z;y=vh/2-((e.clientY-r.top-p.oy)/p.k)*z;schedule()});
addEventListener('resize',()=>{const oldW=vw,oldH=vh;vw=innerWidth;vh=innerHeight;x+=(vw-oldW)/2;y+=(vh-oldH)/2;if(selected){const s=pages.get(selected);moveTo(fitBounds({x:s.map.x-30,y:s.map.y-65,w:s.map.w+60,h:s.map.h+95},true),false)}else schedule()});addEventListener('hashchange',()=>{const id=readHash();if(id===selected)return;if(pages.has(id))focusPage(id,true,{replace:true});else fitAll(true,{replace:true})});
let exporting=false,toastTimer;
function notify(message){const toast=$('#export-status');toast.textContent=message;toast.hidden=false;$('#announce').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,4500)}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('页面图片读取失败'));img.src=src})}
function pngBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('图片生成失败')),'image/png'))}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function safeName(v){return String(v).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,80)}
function linesFor(ctx,text,width,font){ctx.font=font;const lines=[];for(const paragraph of String(text??'').split('\n')){let line='';for(const char of paragraph){if(line&&ctx.measureText(line+char).width>width){lines.push(line);line=char}else line+=char}lines.push(line)}return lines}
const exportFont='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
async function annotatedPNG(id,image){const s=pages.get(id),a=s.annotation||{},incoming=M.transitions.filter(t=>t.to===id&&!t.isReturn),outgoing=M.transitions.filter(t=>t.from===id),ctx=document.createElement('canvas').getContext('2d'),font='22px '+exportFont,small='19px '+exportFont,bold='600 23px '+exportFont;
const iw=image.naturalWidth,ih=image.naturalHeight,pad=40,side=600,gap=32,left=pad,right=pad+iw+gap,contentWidth=side-48,bodyTop=142,blocks=[];
const addText=(type,text)=>{const lines=linesFor(ctx,text,contentWidth-30,font);blocks.push({type,text,lines,h:lines.length*34+24})};
blocks.push({type:'heading',text:'布局',h:50});for(const text of a.layout||[s.purpose||s.title])addText('bullet',text);if(a.issue)addText('bullet','原型问题：'+a.issue);
blocks.push({type:'heading',text:'入口',h:58});if(!incoming.length)addText('bullet',s.entry||'应用默认入口');
function addRoute(t,entry){const other=pages.get(entry?t.from:t.to),trigger=linesFor(ctx,t.trigger,contentWidth-32,small),effect=linesFor(ctx,t.effect||'切换到目标状态',contentWidth-54,small),title=linesFor(ctx,other.title,contentWidth-150,bold),h=24+trigger.length*29+16+effect.length*29+16+Math.max(70,29+title.length*30)+22+(entry?52:0);blocks.push({type:'route',entry,t,other,trigger,effect,title,h})}
for(const t of incoming)addRoute(t,true);blocks.push({type:'heading',text:'交互',h:58});if(!outgoing.length&&!a.rules?.length)addText('bullet','此状态未记录独立操作');for(const t of outgoing)addRoute(t,false);if(a.rules?.length){blocks.push({type:'heading',text:'状态规则',h:58});for(const text of a.rules)addText('bullet',text)}
const noteH=blocks.reduce((v,b)=>v+b.h,0)+24,width=right+side+pad,height=bodyTop+Math.max(ih,noteH)+pad;
if(width>16384||height>16384||width*height>50000000)throw new Error('标注内容过长，请拆分状态后导出');
const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const c=canvas.getContext('2d');c.fillStyle='#f3f2eb';c.fillRect(0,0,width,height);c.textBaseline='top';
c.fillStyle='#353d2e';c.font='600 34px '+exportFont;c.fillText(s.title,left,34,iw);c.fillStyle='#67735b';c.font='21px '+exportFont;c.fillText((DATA.title||'UE')+' / '+s.module,left,88,iw);c.font='18px ui-monospace,monospace';const badgeW=c.measureText(id).width+24;c.fillStyle='#e5ebdb';c.fillRect(right,45,badgeW,34);c.fillStyle='#5c7148';c.fillText(id,right+12,52);
c.fillStyle='#fffefa';c.fillRect(left,bodyTop,iw,ih);c.drawImage(image,left,bodyTop);c.strokeStyle='#dce0d1';c.lineWidth=1;c.strokeRect(left-.5,bodyTop-.5,iw+1,ih+1);c.fillStyle='#fffefa';c.fillRect(right,bodyTop,side,noteH);
const textLines=(lines,x,y,usedFont,color,lineHeight)=>{c.font=usedFont;c.fillStyle=color;lines.forEach((line,i)=>c.fillText(line,x,y+i*lineHeight))};
const drawNode=async(block,xx,ry)=>{const thumb=await loadImage(DATA.thumbs[block.other.id]);const bitmap=await createImageBitmap(thumb,{resizeWidth:92,resizeHeight:64,resizeQuality:'high'});c.drawImage(bitmap,xx+16,ry);bitmap.close();c.strokeStyle='#dbe1cd';c.strokeRect(xx+16,ry,92,64);c.font='16px ui-monospace,monospace';const idw=c.measureText(block.other.id).width+12;c.fillStyle='#e2e9d6';c.fillRect(xx+122,ry,idw,22);c.fillStyle='#5d7349';c.fillText(block.other.id,xx+128,ry+3);textLines(block.title,xx+122,ry+29,bold,'#4c6140',30);return Math.max(70,29+block.title.length*30)};
let yy=bodyTop+12;for(const block of blocks){const xx=right+24;if(block.type==='heading'){c.font='600 24px '+exportFont;c.fillStyle='#586e44';c.fillText(block.text,xx,yy+14)}else if(block.type==='bullet'){c.fillStyle='#a2ac91';c.fillRect(xx+1,yy+13,6,6);textLines(block.lines,xx+20,yy+3,font,'#526046',34)}else{c.fillStyle='#f2f5eb';c.fillRect(xx,yy,contentWidth,block.h-12);c.strokeStyle='#dce3cf';c.strokeRect(xx+.5,yy+.5,contentWidth-1,block.h-13);let ry=yy+15;if(block.entry)ry+=await drawNode(block,xx,ry)+16;textLines(block.trigger,xx+16,ry,small,'#445e36',29);ry+=block.trigger.length*29+12;c.strokeStyle='#b1bc9e';c.beginPath();c.moveTo(xx+22,ry);c.lineTo(xx+22,ry+block.effect.length*29+8);c.stroke();c.font='23px '+exportFont;c.fillStyle='#8e6a44';c.fillText('↓',xx+13,ry+block.effect.length*29-8);textLines(block.effect,xx+41,ry,small,'#7a704d',29);ry+=block.effect.length*29+20;if(block.entry){c.fillStyle='#e4ebd9';c.fillRect(xx+16,ry,contentWidth-32,34);c.fillStyle='#576e43';c.font='18px '+exportFont;c.fillText('当前页面 · '+id,xx+26,ry+7)}else await drawNode(block,xx,ry)}yy+=block.h}
return pngBlob(canvas)}
async function exportSelected(withNotes){if(!selected||exporting)return;const id=selected;exporting=true;closePanels();$('#export-trigger').disabled=true;$('#export-trigger').setAttribute('aria-busy','true');notify('正在生成图片…');try{await document.fonts.ready;const img=await loadImage(DATA.thumbs[id]);let blob;if(withNotes)blob=await annotatedPNG(id,img);else{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;if(c.width>16384||c.height>16384||c.width*c.height>50000000)throw new Error('页面图片超出可导出尺寸');c.getContext('2d').drawImage(img,0,0);blob=await pngBlob(c)}downloadBlob(blob,safeName(id+'_'+pages.get(id).title)+(withNotes?'_UE标注':'_页面')+'.png');notify('已导出：'+pages.get(id).title+(withNotes?' · UE 标注':' · 页面'))}catch(error){notify('导出失败：'+error.message)}finally{exporting=false;$('#export-trigger').removeAttribute('aria-busy');schedule()}}
$('#export-page').onclick=()=>exportSelected(false);$('#export-ue').onclick=()=>exportSelected(true);

$('#export-trigger').onclick=()=>{if(!selected)return;const show=$('#export-menu').hidden;closePanels();$('#export-menu').hidden=!show;$('#export-trigger').setAttribute('aria-expanded',String(show))};
const initialId=readHash();if(pages.has(initialId))focusPage(initialId,false,{replace:true});else fitAll(false,{replace:true});
</script></body></html>
